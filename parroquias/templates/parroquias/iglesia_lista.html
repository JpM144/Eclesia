{% extends "crud/lista.html" %}

{% block filtros %}
  <form method="get" class="form-inline" role="search">
    <input type="search" name="q" value="{{ busqueda }}" class="form-control form-control-sm mr-2 mb-1"
           placeholder="Buscar iglesia...">
    <select name="parroquia" class="form-control form-control-sm mr-2 mb-1">
      <option value="">Todas las parroquias</option>
      {% for parroquia in parroquias %}
        <option value="{{ parroquia.pk }}"
                {% if filtro_parroquia == parroquia.pk|stringformat:"s" %}selected{% endif %}>
          {{ parroquia.nombre }}
        </option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-default btn-sm mb-1">
      <i class="fas fa-filter"></i> Filtrar
    </button>
  </form>
{% endblock %}
